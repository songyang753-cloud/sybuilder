# Node CI jobs: paste under jobs:. Security checks block by default; no blanket waiver.
# Historical debt requires a separately reviewed, owner/expiry-bound policy; this template grants none.
  frontend:
    timeout-minutes: 15  # 2026-09-29 评审 M15:阻塞点要有墙钟超时(承重层 F1)
    name: 前端 (Node/TS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: frontend        # 按实际目录改/删
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-27
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-09-27
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci                         # 取代 npm install：严格按 lockfile，可复现
      - name: 代码规范 (ESLint)
        run: npx eslint . --max-warnings 0
      - name: 类型检查 (tsc / vue-tsc)
        run: npm run typecheck
      - name: 供应链漏洞 (npm audit)
        run: npm audit --audit-level=high
      - name: 测试 + 覆盖率
        # ⚠️ 这一步曾经**整个缺失**（2026-09-05 审出）：本 skill 的 SKILL.md 明确警告
        #    「前端 build 都不跑测试 ⇒ CI 绿 ≠ 上线安全」，章程模板也把「测试(含竞态)」列为强制，
        #    而这份模板当时只有 build —— **它警告别人的那件事，正是它自己在做的事**。
        #    对照 ci-go.yml：那边一直有「测试 + 竞态 + 覆盖率」。同一份 skill 的两个模板，标准不一致。
        run: npm test -- --coverage        # vitest/jest 按实际改；无测试脚本时先建最小套件，别删这一步
      - name: 构建
        run: npm run build

  # 跨语言通用的密钥扫描 job（任意栈都建议加）
  security:
    timeout-minutes: 15  # 2026-09-29 评审 M15:阻塞点要有墙钟超时(承重层 F1)
    name: 安全 (密钥扫描)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-27
        with:
          fetch-depth: 0
      - name: Secret 扫描 (gitleaks)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2, verified 2026-09-27
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
